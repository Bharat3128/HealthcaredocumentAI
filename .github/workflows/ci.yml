name: Healthcare Document AI CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore HealthcareDocumentAI.sln

      - name: Build
        run: dotnet build HealthcareDocumentAI.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test HealthcareDocumentAI.sln --configuration Release --no-build

      - name: Build Docker image
        run: docker build -t healthcare-document-ai:${{ github.sha }} .
